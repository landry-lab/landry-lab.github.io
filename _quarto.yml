project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
  resources:
    - pages/members.json

website:
  open-graph: true
  title: "The Landry Lab"
  site-url: https://landry-lab.github.io
  repo-url: https://github.com/landry-lab/landry-lab.github.io
  favicon: assets/images/uva.ico

  navbar:
    style: "floating"
    background: dark
    foreground: light
    left:
      - href: index.qmd
        text: Home
      - href: pages/research.qmd
        text: Research Areas
      - href: pages/publications.qmd
        text: Publications
      - href: pages/software.qmd
        text: Software
      - text: About
        menu:
          - text: Lab Members
            href: pages/people.qmd
          - text: Lab Values
            href: pages/values.qmd
          - text: Joining the lab
            href: pages/joining.qmd
          - text: Gallery
            href: pages/gallery.qmd
    search: true
    pinned: true

format:
  html:
    theme: spacelab
    mainfont: franklin-gothic, sans-serif
    toc: true
    smooth-scroll: true
    html-math-method: katex
    include-in-header:
      - includes.html
    footnotes-hover: false
    code-fold: true